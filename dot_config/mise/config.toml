[tools]
java = "latest"
# Track the requested Node major while allowing Mise to select its latest patch.
node = "26"
bun = "latest"
lua = "5.1"
pnpm = "latest"
maven = "latest"
gradle = "latest"
kotlin = "latest"
rust = { version = "latest", components = "rust-analyzer" }
uv = "latest"
"pipx:serena-agent" = { version = "latest", uvx_args = "--python 3.13" }
# Use Playwright's bundled MCP server; Mise blocks future trust-evidence downgrades.
"npm:playwright" = "latest"
"npm:mcp-mermaid" = { version = "latest", allow_builds = ["mcp-mermaid"] }
# Keep GitNexus independent of Node upgrades; activate its database binary and vendored grammars.
"npm:gitnexus" = { version = "latest", allow_builds = ["@ladybugdb/core", "gitnexus"] }
[settings]
idiomatic_version_file_enable_tools = ["node"]
minimum_release_age = "7d"
always_keep_download = false
always_keep_install = false
jobs = 8
http_timeout = "30s"
